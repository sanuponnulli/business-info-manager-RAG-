services:
  chroma:
    # Pinned version so an upstream release can't silently break us.
    # Must stay compatible with the `chromadb` npm client (3.x ↔ server 1.x).
    image: chromadb/chroma:1.5.9
    ports:
      - "8000:8000"
    volumes:
      # Chroma 1.x stores its database in /data; the named volume keeps it across restarts.
      - chroma-data:/data
    environment:
      - ANONYMIZED_TELEMETRY=FALSE

  hr-db:
    # The HR database (server/prisma/). Host port 5433, because a locally
    # installed Postgres often already uses 5432.
    image: postgres:17.6-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=hr
      - POSTGRES_PASSWORD=hr
      - POSTGRES_DB=hr
    volumes:
      - hr-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr -d hr"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  chroma-data:
  hr-db-data:
